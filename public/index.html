<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inkman — Budget Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Inkman</h1>
    <div class="topbar-actions">
      <button id="connectBtn" class="btn primary">Connect Gmail</button>
      <span id="connectedAs" class="muted" hidden></span>
      <button id="syncBtn" class="btn" hidden>Sync</button>
      <button id="jarBtn" class="jar-icon-btn" aria-label="Savings Jar" title="Savings Jar">🏺</button>
      <button id="settingsBtn" class="jar-icon-btn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <p id="reconnectNotice" class="notice" hidden>
    Your Gmail connection expired or was revoked. Please reconnect.
  </p>
  <p id="syncStatus" class="muted sync-status" hidden></p>

  <main class="calendar-wrap">
    <button id="prevBtn" class="nav-arrow" aria-label="Previous month">&lsaquo;</button>
    <div id="scroller" class="calendar-scroller"></div>
    <button id="nextBtn" class="nav-arrow" aria-label="Next month">&rsaquo;</button>
  </main>

  <div id="dayModal" class="modal-backdrop" hidden>
    <div class="modal">
      <button class="modal-close" data-close-modal="dayModal" aria-label="Close">&times;</button>
      <button id="dayJarBtn" class="jar-icon-btn modal-jar-icon" aria-label="Savings Jar" title="Savings Jar">🏺</button>
      <div id="dayModalBody"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <div id="jarModal" class="modal-backdrop" hidden>
    <div class="modal">
      <button class="modal-close" data-close-modal="jarModal" aria-label="Close">&times;</button>
      <div id="jarModalBody"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop" hidden>
    <div class="modal">
      <button class="modal-close" data-close-modal="settingsModal" aria-label="Close">&times;</button>
      <div id="settingsModalBody"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
