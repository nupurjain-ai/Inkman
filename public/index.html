<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inkman — UPI Email Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Inkman</h1>
    <p class="subtitle">Connect Gmail, then search for UPI emails in the subject line.</p>

    <section id="connection">
      <button id="connectBtn" class="btn primary">Connect Gmail</button>
      <p id="connectedAs" class="muted" hidden></p>
      <p id="reconnectNotice" class="notice" hidden>
        Your Gmail connection expired or was revoked. Please reconnect.
      </p>
    </section>

    <section id="searchSection" hidden>
      <label for="daysInput">Search the last</label>
      <input id="daysInput" type="number" min="1" max="365" value="30" />
      <label for="daysInput">days</label>
      <button id="searchBtn" class="btn">Search</button>

      <div id="result" class="result"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
